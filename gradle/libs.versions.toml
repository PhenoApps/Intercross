[versions]
# SDK
compileSdk = "37"
kotestRunnerJunit5 = "5.8.0"
minSdk = "23"
robolectric = "4.11"
targetSdk = "37"

# App
versionCode = "300"
versionName = "3.0.0"

# Kotlin & Core
kotlin = "2.2.10"
ksp = "2.3.2"
coroutines = "1.11.0"
coreKtx = "1.15.0"

# Android Gradle Plugin
agp = "9.1.1"

# AndroidX
